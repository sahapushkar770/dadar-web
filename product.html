<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Manage | Saha Enterprise</title>

<link rel="stylesheet" href="product.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <a href="home.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <h1>Product Manage</h1>

</header>



<!-- ================= SEARCH ================= -->

<div class="search-box">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input 
    type="text"
    id="search"
    placeholder="Search Product...">

</div>



<!-- ================= PRODUCT GRID ================= -->

<div id="productGrid">


<!-- Product cards will load from JS -->


</div>





<!-- ================= ADD BUTTON ================= -->

<button class="fab" onclick="openAddPopup()">

    <i class="fa-solid fa-plus"></i>

</button>






<!-- ================= PRODUCT DETAILS POPUP ================= -->


<div class="popup" id="detailsPopup">


<div class="popup-box">


<h2 id="detailsName">
Product Name
</h2>


<p id="detailsPrice">
Price: ₹0
</p>



<h3>
Flavours
</h3>


<div id="detailsFlavours">

</div>



<div class="popup-buttons">


<button class="edit-btn"
onclick="openEditFromDetails()">

<i class="fa-solid fa-pen"></i>
Edit

</button>



<button class="cancel"
onclick="closeDetailsPopup()">

Close

</button>


</div>


</div>

</div>







<!-- ================= ADD PRODUCT POPUP ================= -->


<div class="popup" id="addPopup">


<div class="popup-box">


<h2>
Add Product
</h2>



<input 
type="text"
id="productName"
placeholder="Product Name">



<input 
type="number"
id="productPrice"
placeholder="Product Price">





<h3>
Flavours
</h3>


<div class="flavour-input">


<input
type="text"
id="flavourInput"
placeholder="Enter flavour">


<button onclick="addFlavour()">

Add

</button>


</div>




<div id="addFlavourList">

</div>




<div class="popup-buttons">


<button class="save"
onclick="saveProduct()">

Save

</button>



<button class="cancel"
onclick="closeAddPopup()">

Cancel

</button>


</div>



</div>

</div>








<!-- ================= EDIT PRODUCT POPUP ================= -->


<div class="popup" id="editPopup">


<div class="popup-box">


<h2>
Edit Product
</h2>



<input
type="text"
id="editProductName">



<input
type="number"
id="editProductPrice">





<h3>
Flavours
</h3>




<div class="flavour-input">


<input
type="text"
id="editFlavourInput"
placeholder="Enter flavour">



<button onclick="addEditFlavour()">

Add

</button>


</div>




<div id="editFlavourList">

</div>





<div class="popup-buttons">


<button class="save"
onclick="updateProduct()">

Update

</button>



<button class="cancel"
onclick="closeEditPopup()">

Cancel

</button>


</div>



</div>

</div>







<!-- ================= DELETE POPUP ================= -->


<div class="popup" id="deletePopup">


<div class="popup-box">


<h2>
Delete Product
</h2>



<p>
Are you sure you want to delete this product?
</p>




<div class="popup-buttons">


<button class="delete-btn"
onclick="confirmDelete()">

Delete

</button>



<button class="cancel"
onclick="closeDeletePopup()">

Cancel

</button>



</div>


</div>

</div>







<script src="product.js"></script>


</body>

</html>
