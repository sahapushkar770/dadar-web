<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Data | Saha Enterprise</title>

    <link rel="stylesheet" href="party-data.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>

    <a href="home.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <h1>Party Data</h1>

</header>

<div class="search-box">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
        type="text"
        id="search"
        placeholder="Search Party...">

</div>

<!-- ================= PARTY LIST ================= -->

<div id="partyList">

    <!-- Party 1 -->

    <div class="party-card">

        <div class="avatar">
            A
        </div>

        <div class="party-info">

            <h3>ABC Traders</h3>

            <p>+91 9876543210</p>

        </div>

        <div class="menu">

            <button
            class="menu-btn"
            onclick="toggleMenu(this)">

                <i class="fa-solid fa-ellipsis-vertical"></i>

            </button>

            <div class="dropdown">

                <button onclick="editParty(this)">
                    <i class="fa-solid fa-pen"></i>
                    Edit
                </button>

                <button
                class="delete"
                onclick="deleteParty(this)">

                    <i class="fa-solid fa-trash"></i>
                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ================= FLOATING BUTTON ================= -->

<button
class="fab"
onclick="openAddPopup()">

    <i class="fa-solid fa-plus"></i>

</button>

<!-- ================= ADD POPUP ================= -->

<div class="popup" id="addPopup">

<div class="popup-box">

<h2>Add Party</h2>

<input
type="text"
id="partyName"
placeholder="Party Name">

<input
type="tel"
id="partyPhone"
placeholder="Phone Number"
maxlength="10"
inputmode="numeric"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">

<div class="popup-buttons">

<button
class="save"
onclick="saveParty()">

Save

</button>

<button
class="cancel"
onclick="closeAddPopup()">

Cancel

</button>

</div>

</div>

</div>

<!-- ================= EDIT POPUP ================= -->

<div class="popup" id="editPopup">

<div class="popup-box">

<h2>Edit Party</h2>

<input
type="text"
id="editName">

<input
type="tel"
id="editPhone"
maxlength="10"
inputmode="numeric"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">

<div class="popup-buttons">

<button
class="save"
onclick="updateParty()">

Update

</button>

<button
class="cancel"
onclick="closeEditPopup()">

Cancel

</button>

</div>

</div>

</div>

<!-- ================= DELETE POPUP ================= -->

<div class="popup" id="deletePopup">

<div class="popup-box">

<h2>Delete Party</h2>

<p>

Are you sure you want to delete this party?

</p>

<div class="popup-buttons">

<button
class="delete-btn"
onclick="confirmDelete()">

Delete

</button>

<button
class="cancel"
onclick="closeDeletePopup()">

Cancel

</button>

</div>

</div>

</div>

<script src="party-data.js"></script>

</body>
</html>
